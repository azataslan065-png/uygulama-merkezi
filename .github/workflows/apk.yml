# Uygulama Merkezi APK'sı (mağaza uygulaması). Kabuk (android/) değişince ya da elle derlenir; APK "apk" sürümüne yüklenir.
# Mağaza sayfası sitede durduğu için sayfa değişiklikleri yeni APK gerektirmez.
name: APK
on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/apk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --console=plain
      - name: Yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/magaza/release/*.apk out/Uygulama-Merkezi.apk
          cp android/app/build/outputs/apk/yonetim/release/*.apk out/Uygulama-Merkezi-Yonetim.apk
          ls -la out
          gh release delete apk -y --cleanup-tag 2>/dev/null || true
          sleep 5
          gh release create apk out/Uygulama-Merkezi.apk out/Uygulama-Merkezi-Yonetim.apk --title "Uygulama Merkezi APK (derleme $GITHUB_RUN_NUMBER)" --notes "Uygulama-Merkezi.apk: mağaza (davetliler). Uygulama-Merkezi-Yonetim.apk: yönetim paneli (yalnızca sahip). Telefona bir kez kur; uygulamalar artık bunun içinden kurulur ve güncellenir." --latest
      # (2026-11-28) KÖK SEBEP ("Kaynak APK indirilemedi (404)"): sürüm silinip hemen aynı etiketle yeniden oluşturulunca, etiket silme işi
      # bitmeden oluşturma yapıldığında GitHub sürümü "taslak" (draft) bırakıyordu; taslaktaki APK herkese 404 veriyordu.
      # Bu adım her derlemeden sonra taslakları düzeltir: aynı etiketle yayında sürüm varsa fazla taslak silinir, yoksa taslak yayımlanır.
      - name: Taslak surumleri duzelt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          sleep 5
          gh api "repos/$R/releases?per_page=100" --jq '.[] | select(.draft) | [(.id|tostring), .tag_name] | @tsv' | while IFS=$'\t' read -r id tag; do
            if gh api "repos/$R/releases/tags/$tag" >/dev/null 2>&1; then gh api -X DELETE "repos/$R/releases/$id" && echo "fazla taslak silindi: $tag"
            else son=false; [ "$tag" = "apk" ] && son=true
              gh api -X PATCH "repos/$R/releases/$id" -F draft=false -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f make_latest="$son" >/dev/null && echo "taslak yayımlandı: $tag"; fi
          done
