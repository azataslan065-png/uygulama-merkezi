<style>
.dev .shell{max-width:760px;padding:calc(72px + var(--safe-t)) 16px calc(40px + var(--safe-b))}
.dev .topbar{position:fixed;left:0;right:0;top:0;margin:0;padding:calc(8px + var(--safe-t)) 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);z-index:40}
.dev .topbar .brand small{font-weight:400;color:var(--mut);font-size:13px;margin-left:6px}
.dev .form-bar{position:sticky;bottom:calc(10px + var(--safe-b));z-index:25;display:flex;gap:10px;padding:10px;border-radius:20px;margin-top:6px;background:var(--surf);border:1px solid var(--line);box-shadow:var(--shadow)}
.dev .form-bar .btn{flex:1}
.dev .app-row{border-bottom:1px solid var(--line)}
.dev .note.rej{background:var(--bad-soft);color:var(--bad)}
</style>
